<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.author.name }}, home">
      <svg class="brand-spike" viewBox="0 0 40 20" width="32" height="16" aria-hidden="true"><polyline points="0,12 12,12 15,10 18,2 21,19 24,8 27,12 40,12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <span class="brand-name">Mandar&nbsp;Patil</span>
    </a>
    <nav id="site-nav" class="site-nav" aria-label="Primary">
      {% for item in site.nav %}
        {% assign active = false %}
        {% if page.url contains item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}><span class="ch">CH{{ forloop.index | prepend: '0' }}</span>{{ item.title }}</a>
      {% endfor %}
    </nav>
    <div class="header-actions">
      <span class="rec" aria-hidden="true"><i></i>REC</span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch light/dark display" title="Switch display">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="nav-toggle" type="button" aria-label="Open menu" aria-controls="site-nav" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8h18M3 16h18"/></svg>
      </button>
    </div>
  </div>
</header>
