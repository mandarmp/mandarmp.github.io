{% assign w = include.item %}
<article class="work-card reveal" data-category="{{ w.category | slugify }}">
  <a class="work-card-link" href="{{ w.url | relative_url }}">
    <div class="work-thumb">
      <img src="{{ w.cover | relative_url }}" alt="{{ w.cover_alt | default: w.title }}" loading="lazy">
      <span class="work-id">REC-{% if w.order < 10 %}0{% endif %}{{ w.order }}</span>
      <span class="work-cat">{{ w.category }}</span>
    </div>
    <div class="work-body">
      <h3>{{ w.title }}</h3>
      <p class="muted">{{ w.summary }}</p>
      <div class="work-foot">
        <span class="mono">{{ w.year }}</span>
        <span class="mono">{{ w.stack | slice: 0, 3 | join: " / " }}</span>
      </div>
    </div>
  </a>
</article>
